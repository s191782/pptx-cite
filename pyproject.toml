[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-citation-manager"
version = "1.0.1"
description = "Replace LaTeX-style citations in PowerPoint presentations using BibTeX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "PyYAML>=6.0",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["pptx_cite"]

[project.scripts]
pptx-citation-manager = "pptx_cite:main"
